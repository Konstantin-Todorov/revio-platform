          - generic [ref=f4e566]:
            - heading "Run your gym with simple instructions" [level=2] [ref=f4e568]
            - paragraph [ref=f4e570]: Things that once required hours of work, multiple tools and endless menus can now be done in seconds. Just describe what you need, and 1club takes care of the rest.
        - region [ref=f4e577]:
          - generic [ref=f4e578]:
            - heading "FAQs" [level=2] [ref=f4e580]
            - generic [ref=f4e582]:
              - article [ref=f4e583]:
                - button "01 What is 1club?" [ref=f4e584] [cursor=pointer]:
                  - generic [ref=f4e585]:
                    - generic [ref=f4e586]: "01"
                    - generic [ref=f4e587]: What is 1club?
                - region "01 What is 1club?":
                  - paragraph [ref=f4e593]: 1club is an AI-native management platform designed for fitness clubs, yoga studios, martial arts gyms, and sports centers. Beyond standard member management, scheduling, and payments, our integrated AI proactively identifies growth opportunities and automates administrative tasks to help your business scale.
              - article [ref=f4e594]:
                - button "02 What core features does 1club include for running my gym?" [ref=f4e595] [cursor=pointer]:
                  - generic [ref=f4e596]:
                    - generic [ref=f4e597]: "02"
                    - generic [ref=f4e598]: What core features does 1club include for running my gym?
                - region "02 What core features does 1club include for running my gym?":
                  - paragraph [ref=f4e604]: You get complete member management, class scheduling with real-time bookings, automated billing, business reporting , AI agents, a mobile app and a branded member portal. Everything works together in one platform so you run your gym without juggling multiple systems.
              - article [ref=f4e605]:
                - button "03 What tools does 1club offer to help grow my gym?" [ref=f4e606] [cursor=pointer]:
                  - generic [ref=f4e607]:
                    - generic [ref=f4e608]: "03"
                    - generic [ref=f4e609]: What tools does 1club offer to help grow my gym?
                - region "03 What tools does 1club offer to help grow my gym?":
                  - paragraph [ref=f4e615]: 1club provides marketing automation for engaging and retaining your members, a branded website for professional online presence, reputation management to generate more positive reviews, and the 1club Sports Network listing to reach new members beyond your existing audience.
              - article [ref=f4e616]:
                - button "04 Does 1club provide a branded mobile app for gyms?" [ref=f4e617] [cursor=pointer]:
                  - generic [ref=f4e618]:
                    - generic [ref=f4e619]: "04"
                    - generic [ref=f4e620]: Does 1club provide a branded mobile app for gyms?
                - region "04 Does 1club provide a branded mobile app for gyms?":
                  - paragraph [ref=f4e626]: Yes, we deliver a custom-branded iOS and Android app featuring your gym's logo and color scheme. This allows members to book classes, check in via mobile, track their fitness progress, and manage payments directly, while push notifications keep your brand top-of-mind.
              - article [ref=f4e627]:
                - button "05 How long does it take to get up and running with 1club?" [ref=f4e628] [cursor=pointer]:
                  - generic [ref=f4e629]:
                    - generic [ref=f4e630]: "05"
                    - generic [ref=f4e631]: How long does it take to get up and running with 1club?
                - region "05 How long does it take to get up and running with 1club?":
                  - paragraph [ref=f4e637]: Most gyms are fully operational within 1-2 weeks. Once you provide your membership structures and schedules, our conversational AI agents handle the technical configuration. This means you spend time gathering your business data rather than struggling to learn complex new software.
              - article [ref=f4e638]:
                - button "06 Is migrating my data to 1club easy?" [ref=f4e639] [cursor=pointer]:
                  - generic [ref=f4e640]:
                    - generic [ref=f4e641]: "06"
                    - generic [ref=f4e642]: Is migrating my data to 1club easy?
                - region "06 Is migrating my data to 1club easy?":
                  - paragraph [ref=f4e648]: Switching to 1club is seamless - we migrate all of your data for free, including member profiles, memberships, and class schedules - so nothing gets left behind.
              - article [ref=f4e649]:
                - button "07 Is there a learning curve for my staff?" [ref=f4e650] [cursor=pointer]:
                  - generic [ref=f4e651]:
                    - generic [ref=f4e652]: "07"
                    - generic [ref=f4e653]: Is there a learning curve for my staff?
                - region "07 Is there a learning curve for my staff?":
                  - paragraph [ref=f4e659]: The learning curve is minimal—1club's interface is clean and intuitive, with everything exactly where you'd expect. AI agents answer questions conversationally in real-time, so staff get instant guidance without leaving their workflow or searching through documentation.
