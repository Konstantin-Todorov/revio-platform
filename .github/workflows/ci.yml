name: CI

# X3. Before this file existed there was NO CI at all — the only thing that ran on a push was
# Railway's build, which deploys first and tells you second. A typecheck error reached production
# and was found by whoever opened the page.
#
# Runs on every push and every PR. Nothing here needs a secret, which is deliberate: a pipeline that
# cannot run on a fork, or that fails for want of a credential, gets ignored within a month. The
# checks that need a REAL database (`rls-verify`, `claim-verify`, `engine-race`) are release gates
# run by hand against one — see DEPLOY.md.
#
# The one exception is `Schema drift`, which uses a throwaway postgres SERVICE CONTAINER. That keeps
# both properties the rule is protecting — no secret, and it still runs on a fork — while catching a
# class nothing else here can see.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A second push supersedes the first — no point finishing a run for a commit nobody will deploy.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Throwaway, and only for `Schema drift` below: `migrate diff --from-migrations` replays every
      # migration into a shadow database to learn what the migrations actually build. No secret, no
      # persistence, works on a fork.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Prisma's generated client is a build input for typecheck and for every app build. Without
      # this step the first three checks fail on missing types rather than on anything real.
      - name: Generate Prisma client
        run: pnpm --filter @revio/db db:generate

      - name: Typecheck
        run: pnpm typecheck

      # Fails on any error, and on more than the budgeted warnings. It also fails if it lints ZERO
      # files, which is what the previous `pnpm -r lint` did silently, forever.
      - name: Lint
        run: pnpm lint

      # Copy conventions across all five apps. Has its own zero-file guard, for the same reason.
      - name: Copy lint
        run: pnpm copy:lint

      # Every server action in RevioLink and RevioCRS is gated, or is exempt WITH A REASON. This is
      # the check that stops X2 quietly coming back the next time somebody adds an action.
      - name: Authorization coverage
        run: pnpm authz:lint

      # Prisma generates migrations FROM the schema, so a schema that has drifted from the
      # migrations is a loaded gun rather than an untidiness: the next `migrate dev` anybody runs
      # emits DROP INDEX for whatever the schema forgot. On 2026-09-02 that was three live
      # performance indexes and the birth-date column of a legal register. Nothing surfaced it —
      # typecheck, lint and the whole suite pass either way. Drift stays invisible until the day it
      # is destructive, which is exactly why it belongs in CI and not in somebody's memory.
      # `Math.max(0, NaN)` is NaN. A server action that hand-rolls form-number parsing writes it to
      # the database — found in production 2026-09-02 on a rate price, and three more live sites the
      # day after, two of them on a confirmed reservation. The helpers in @revio/core/forms/parse
      # already solve it; this checks nobody quietly stops using them.
      # A void action that bails early tells the user nothing — the screen comes back unchanged and
      # they press the button again. A ratchet, not a gate: the number may fall, never rise.
      - name: Silent failures
        run: pnpm silent:lint

      - name: Money parsing
        run: pnpm money:lint

      # All three September founder documents describe one fault: screens reporting health they
      # have not verified. Every instance was a LITERAL — copy written for the good case, rendered
      # whenever the bad case failed to be counted. A green pill over a channel dead for 65 days.
      - name: Invented health
        run: pnpm health:lint

      # `outline-none` silently removes the global focus ring, so a keyboard user loses their place
      # with no visual error anywhere. This ran in `pnpm verify` but NOT here, so main could be red
      # locally and green in CI at the same time — a gate that only half exists.
      - name: Invisible focus
        run: pnpm a11y:lint

      # `<html>` must keep overflow: visible, or `useScrollLock` locks nothing and every dialog in
      # every app stops holding the page behind it — silently. The two halves live in different
      # files (a CSS rule and a React hook) and nothing else connects them.
      - name: Modal scroll locking
        run: pnpm scrolllock:lint

      # A job declared in `JOB` that the cron runner never calls is inert, however well it is written
      # and tested. `waitlist-sweep` shipped that way and had never executed once in production.
      - name: Every job is scheduled
        run: pnpm jobs:lint

      # Pinch-zoom must stay unlocked (WCAG 1.4.4) AND form controls must stay 16px on touch — the
      # two halves of one fix. Lock the viewport and you break magnification for everyone; delete the
      # 16px rule and iOS zooms the page on every focus, which is what makes people lock the viewport.
      - name: Mobile zoom
        run: pnpm zoom:lint

      # Tailwind emits NOTHING for a class it does not know, and says nothing about it — so a wrong
      # shade is an element with no background or invisible text, passing every other check here.
      # `bg-brand-050` shipped that way in the support thread's own bubbles: tokens.ts writes the
      # lightest shade as "050", every app's config registers it as 50.
      - name: Colour classes resolve
        run: pnpm tokens:lint

      # ⚠️ Row-level security fails CLOSED and SILENT. A query on a protected table through the raw
      # Prisma client does not error — it returns ZERO ROWS, and the screen above renders nothing.
      # That shipped on 2026-09-11: the trial banner never appeared and the billing page was blank
      # in all three products, while the typecheck, the build and 2,113 tests were all green,
      # because not one test touches a database. A person found it by opening the screen.
      - name: Perimeter
        run: pnpm perimeter:lint

      - name: Schema drift
        run: pnpm --filter @revio/db db:drift
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # A fresh database is the one journey nothing else here takes. Two real bugs lived in it this
      # week, both invisible to every check above: `db:seed` truncated `OccupancyAdjustment`, a table
      # replaced long ago — TRUNCATE names a real table or fails, so seeding was broken on EVERY
      # database including an empty one, which is the single case where seeding is the whole point.
      # And nothing had ever proved the 100-odd migrations still apply from nothing, because
      # production has never been reset and never will be.
      #
      # It runs against the same throwaway container as the drift check, in its own database so the
      # two cannot interfere.
      - name: Migrations from zero, then the seed
        run: |
          psql "$ADMIN_URL" -c 'CREATE DATABASE revio_ci'
          pnpm --filter @revio/db db:deploy
          pnpm --filter @revio/db db:seed
        env:
          ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/revio_ci
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/revio_ci

      # `revio_ci` above is a real database with every migration applied, so the database-backed
      # tests (public signup end to end) run here rather than skipping. Without this env they skip
      # silently — and a test that skips in CI is a test that does not exist.
      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/revio_ci
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/revio_ci

      # LAST, because it is the slowest and because it catches a class the others cannot: `pnpm
      # typecheck` and `pnpm test` both pass on code that fails `next build`. That has bitten this
      # repo before, which is why it is a required step and not a nightly job.
      - name: Build
        run: pnpm build
