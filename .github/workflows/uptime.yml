# Is the platform up? Asked from OUTSIDE the platform.
#
# On 2026-08-23 a Railway compute cap stopped all six services and the Postgres container. Nothing
# announced it; it was found because a `git push` failed. Any monitor living inside Railway would
# have stopped at the same instant and reported nothing — a watchdog that shares a fate with the
# thing it watches is not a watchdog.
#
# GitHub Actions runs on someone else's infrastructure, is free for this, and needs no new vendor,
# no new account and no secret. A failing run emails the repository owner; the issue it opens is the
# durable record, so an outage at 03:00 is still visible at 09:00.
#
# The cron jobs service is monitored differently — see `jobs-heartbeat` below. Uptime says a service
# answers; it cannot say a scheduled job ever ran.

name: Uptime

on:
  schedule:
    # Every 10 minutes. GitHub does not guarantee the minute and will skip runs when busy, which is
    # acceptable: this catches an outage within a few polls, and the alternative is paying somebody.
    - cron: "*/10 * * * *"
  workflow_dispatch:

# One at a time. Overlapping runs would open duplicate issues for one outage.
concurrency:
  group: uptime
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe every service
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          declare -A SERVICES=(
            ["RevioLink"]="https://cm.reviosoft.app/api/health"
            ["RevioCRS"]="https://crs.reviosoft.app/api/health"
            ["RevioPMS"]="https://pms.reviosoft.app/api/health"
            ["Operator"]="https://operator.reviosoft.app/api/health"
            ["RevioDirect"]="https://booking.reviosoft.app/api/health"
            ["Website"]="https://reviosoft.app/"
            # Not a service but a dead-man's switch: 503 when a scheduled job has stopped running.
            # Uptime says a service answers; only this says the night audit still happens.
            ["Scheduled jobs"]="https://operator.reviosoft.app/api/health/jobs"
          )

          failures=""
          for name in "${!SERVICES[@]}"; do
            url="${SERVICES[$name]}"
            # Two attempts before calling it down. A single timeout is usually a cold start or a
            # deploy swapping containers, and a monitor that cries wolf gets muted — which is the
            # only failure mode worse than no monitor.
            for attempt in 1 2; do
              body=$(curl -sS --max-time 20 -o /tmp/body.txt -w '%{http_code}' "$url" 2>/tmp/err.txt) && code="$body" || code="000"
              [ "$code" = "200" ] && break
              [ "$attempt" = "1" ] && sleep 15
            done

            if [ "$code" = "200" ]; then
              detail=$(head -c 120 /tmp/body.txt | tr -d '\n')
              echo "  ok    $name — $detail"
            else
              reason=$(head -c 160 /tmp/body.txt | tr -d '\n')
              [ -z "$reason" ] && reason=$(head -c 160 /tmp/err.txt | tr -d '\n')
              echo "  DOWN  $name — HTTP $code ${reason}"
              failures="${failures}- **$name** — HTTP \`$code\` ${reason}"$'\n'
            fi
          done

          if [ -n "$failures" ]; then
            {
              echo "failures<<EOF"
              echo "$failures"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the outage issue
        if: steps.probe.outputs.failures != ''
        uses: actions/github-script@v7
        with:
          script: |
            const failures = `${{ steps.probe.outputs.failures }}`;
            const TITLE = "🔴 Platform outage detected by uptime monitor";
            const body = [
              `Detected at ${new Date().toISOString()} by [\`uptime.yml\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              ``, failures, ``,
              `First checks: Railway usage limits (a compute cap took the platform down on 2026-08-23),`,
              `then the service logs, then \`docs/RESTORE.md\` if the database is involved.`,
              ``,
              `This issue is reused while the outage continues and closed automatically once every`,
              `service answers again.`,
            ].join("\n");

            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "outage", per_page: 10,
            });
            if (open.data.length > 0) {
              // Comment rather than open a second issue: one outage, one thread.
              await github.rest.issues.createComment({ ...context.repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title: TITLE, body, labels: ["outage"] });
            }

      - name: Close the outage issue once everything answers
        if: steps.probe.outputs.failures == ''
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "outage", per_page: 10,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `✅ Every service answered at ${new Date().toISOString()}. Closing.`,
              });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: "closed" });
            }

      - name: Fail the run so GitHub emails
        if: steps.probe.outputs.failures != ''
        run: |
          echo "::error::One or more services are down."
          exit 1
